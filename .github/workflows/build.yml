name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        working-directory: native
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: charmsbar-native-x64
          path: native/bin/charmsbar-native.exe
          if-no-files-found: error
